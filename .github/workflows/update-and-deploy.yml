name: Update data & deploy site

on:
  schedule:
    - cron: "7 22 * * 0"   # setiap Senin 05.07 WIB (Minggu 22.07 UTC)
  workflow_dispatch:        # tombol "Run workflow" untuk pembaruan manual
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik data terbaru (OpenAlex, Crossref)
        if: github.event_name != 'push'
        run: python scripts/update_data.py

      - name: Simpan perubahan data.json
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name "site-updater[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "data: pembaruan otomatis $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Tidak ada perubahan data."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

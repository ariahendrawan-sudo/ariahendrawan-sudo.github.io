name: Update data & deploy site

on:
  schedule:
    - cron: "7 22 * * 0"   # setiap Senin 05.07 WIB (Minggu 22.07 UTC)
  workflow_dispatch:        # tombol "Run workflow" untuk pembaruan manual
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tarik data terbaru (OpenAlex, Crossref, SINTA)
        # dilewati untuk commit data dari tugas SINTA agar tidak menarik ulang
        if: "!contains(github.event.head_commit.message, 'data: pembaruan otomatis')"
        run: python scripts/update_data.py

      - name: Siapkan Chromium untuk pre-render
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Pre-render HTML statis (SEO) dan sitemap
        run: python scripts/prerender.py

      - name: Simpan perubahan
        run: |
          git add -N status.json 2>/dev/null || true
          if ! git diff --quiet -- data.json status.json index.html sitemap.xml; then
            git config user.name "site-updater[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json status.json index.html sitemap.xml
            git commit -m "build: pembaruan data dan pre-render $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Tidak ada perubahan."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
